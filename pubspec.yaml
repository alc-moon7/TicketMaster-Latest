name: ticketmaster
description: "Ticketmaster-style editable ticket app."
publish_to: 'none' 


version: 2.0.4+5

environment:
  sdk: ">=3.5.4 <4.0.0"


dependencies:
  flutter:
    sdk: flutter

  cloud_firestore: ^6.0.2
  cupertino_icons: ^1.0.8
  firebase_auth: ^6.0.2
  firebase_core: ^4.0.2
  firebase_storage: ^13.0.2
  video_player: ^2.9.2
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.13.0

 
  flutter_lints: ^5.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/splash_screen.mp4
    - assets/icon.jpg
    - assets/icon_original.jpg
    - assets/icon_foreground.png
    - assets/hero.jpg
    - assets/talent.jpg
    - assets/tm/
    - assets/tm_nav/
    - assets/tm_nav_norm/
    - assets/apk/images/
    - assets/apk/images/bottom/
    - assets/apk/images/bottom_click/
    - assets/reference/home/
    - screenshot/IMG_0368.PNG
    - screenshot/IMG_0372.PNG
    - V2/Screenshot_20260918-201401.png

  fonts:
    - family: SourceSans3
      fonts:
        - asset: assets/fonts/event_reference/source_sans_3_regular.ttf
          weight: 400
        - asset: assets/fonts/event_reference/source_sans_3_semi_bold.ttf
          weight: 600
        - asset: assets/fonts/event_reference/source_sans_3_bold.ttf
          weight: 700
        - asset: assets/fonts/event_reference/source_sans_3_extra_bold.ttf
          weight: 800
    - family: EventAverta
      fonts:
        - asset: assets/fonts/event_reference/averta_regular.otf
          weight: 400
        - asset: assets/fonts/event_reference/averta_semibold.otf
          weight: 600
    - family: Metropolis
      fonts:
        - asset: assets/fonts/metropolis/Metropolis-Thin.otf
          weight: 100
        - asset: assets/fonts/metropolis/Metropolis-Regular.otf
          weight: 400
        - asset: assets/fonts/metropolis/Metropolis-Medium.otf
          weight: 500
        - asset: assets/fonts/metropolis/Metropolis-SemiBold.otf
          weight: 600
        - asset: assets/fonts/metropolis/Metropolis-Bold.otf
          weight: 700

flutter_icons:
  android: true
  ios: true
  image_path: assets/icon.jpg
  adaptive_icon_background: "#026CDF"
  adaptive_icon_foreground: assets/icon_foreground.png
